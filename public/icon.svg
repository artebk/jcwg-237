<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#142c5b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Sun -->
  <circle cx="330" cy="180" r="76" fill="url(#sunGrad)"/>
  
  <!-- Cloud -->
  <g fill="url(#cloudGrad)">
    <circle cx="210" cy="270" r="70"/>
    <circle cx="280" cy="230" r="82"/>
    <circle cx="360" cy="280" r="60"/>
    <rect x="210" y="270" width="150" height="70" rx="20"/>
  </g>
  
  <!-- Raindrops -->
  <g stroke="#38bdf8" stroke-width="8" stroke-linecap="round">
    <line x1="220" y1="370" x2="208" y2="402"/>
    <line x1="280" y1="370" x2="268" y2="402"/>
    <line x1="340" y1="370" x2="328" y2="402"/>
  </g>
</svg>
